# 允许 WebSocket 请求升级，普通 HTTP 请求继续关闭连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# AI 平台独立入口；New API 仅监听本机，由此站点转发公网流量。
server {
    listen 80;
    server_name ai.al-bei.cn;

    return 301 https://ai.al-bei.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name ai.al-bei.cn;

    ssl_certificate /etc/letsencrypt/live/al-bei.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/al-bei.cn/privkey.pem;

    client_max_body_size 50m;

    # 平台入口直接进入登录页，避免向访客展示上游默认介绍页。
    location = / {
        return 302 /sign-in;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
